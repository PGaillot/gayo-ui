<div id="demon-card">
  <svg class="card-noise-filter-element" viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'>
    <filter id='noiseFilter'>
      <feTurbulence 
        type='fractalNoise' 
        baseFrequency='0.5' 
        numOctaves='3' 
        stitchTiles='stitch'/>
    </filter>
    <rect width='100%' height='100%' filter='url(#noiseFilter)'/>
  </svg>


    <svg id="title-card" viewBox="0 0 400 200" width="400" height="200">
        <defs>
          <path id="curve" d="M40 200C40 111.634 111.634 40 200 40C288.366 40 360 111.634 360 200" fill="none" />
        </defs>
        <text>
          <textPath xlink:href="#curve" startOffset="50%" text-anchor="middle" class="border">
            {{ demon.name }}
          </textPath>
          <textPath xlink:href="#curve" startOffset="50%" text-anchor="middle" class="title">
            {{ demon.name }}
          </textPath>
        </text>
      </svg>
        <p id="effect">{{ demon.description }}</p>
    <div id="demon-dice-num-container">
      @for (dice of demon.dices; track $index) {
        @if(dice === null){
          <p class="dice-number">infini</p>
        }
        @else {
          <p class="dice-number">{{ dice }}</p>
        }
      }
    </div>
    
    <div class="image" alt=""></div>

    <div id="id">{{ demon.id | idPipe }}</div>
    <img id="demon-flame" src="/lsd/demon-border.svg" alt="">
  </div>
