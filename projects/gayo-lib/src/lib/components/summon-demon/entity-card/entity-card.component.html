<div id="entity-card">
  <svg class="card-noise-filter-element" viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'>
    <filter id='noiseFilter'>
      <feTurbulence type='fractalNoise' baseFrequency='0.5' numOctaves='3' stitchTiles='stitch' />
    </filter>
    <rect width='100%' height='100%' filter='url(#noiseFilter)' />
  </svg>

  <svg id="title-card" viewBox="0 0 400 200" width="400" height="200">
    <defs>
      <path id="curve" d="M40 200C40 111.634 111.634 40 200 40C288.366 40 360 111.634 360 200" fill="none" />
    </defs>
    <text>
      <textPath xlink:href="#curve" startOffset="50%" text-anchor="middle" class="border">
        {{entity.kindness}} {{ entity.name }}
      </textPath>
      <textPath xlink:href="#curve" startOffset="50%" text-anchor="middle" class="title">
        {{entity.kindness}} {{ entity.name }}
      </textPath>
    </text>
  </svg>

  <p id="effect">{{ entity.description }}</p>
  <div id="dice-num-container">
    @for (dice of entity.dices; track $index) {
    <p class="dice-number">{{ dice }}</p>
    }
  </div>

  <div id="type">
    @switch (entity.gender) {
    @case ('garçon') {
    <div class="icon man"></div> 
    }
    @case ("fille") {
    <div class="icon woman"></div> 
    }
    @default {
    <div class="icon animal"></div>  
    }
    }
  </div>

  <div class="entity-candle candle-1"></div>
  <div class="entity-candle candle-2"></div>
  <div class="entity-candle candle-3"></div>

  <div id="pentacle">
    <svg width="100%" height="100%" viewBox="0 0 165 157" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M34.4212 5.39567L82.188 150.309L129.149 5.39567L6.40601 95.2861H158.373L34.4212 5.39567Z"
        stroke="#C5162F" stroke-width="6" />
    </svg>
  </div>
  <div id="id">{{ entity.id | idPipe }}</div>
</div>
